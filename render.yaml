services:
  - type: web
    name: yogie-corporation
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: INQUIRY_RECIPIENT
        value: Liptonmourin@yogiecorp.com, akhtar@yogiecorp.com, yogie@yogiecorp.com
